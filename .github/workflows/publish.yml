name: Publish WP Awesome package and plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish or retry, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wp-awesome-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(bun -p 'require("./package.json").version')"
          test "$(bun -p 'require("./package.json").name')" = 'wp-awesome'
          git merge-base --is-ancestor HEAD origin/main
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Build the exact release tarball
        run: bun pm pack --ignore-scripts --destination artifacts
      - name: Verify npm identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org/
      - name: Check for an existing registry version
        id: registry
        run: |
          version=$(bun -p 'require("./package.json").version')
          if npm view "wp-awesome@$version" version --json > "$RUNNER_TEMP/npm-version.json" 2> "$RUNNER_TEMP/npm-version-error.txt"; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' "$RUNNER_TEMP/npm-version-error.txt" "$RUNNER_TEMP/npm-version.json"; then
            echo 'published=false' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/npm-version-error.txt" >&2
            exit 1
          fi
      - name: Publish the verified tarball
        if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./artifacts/wp-awesome-*.tgz --access public --ignore-scripts
      - name: Create or update the GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git for-each-ref --format='%(contents)' "refs/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [ "$release_draft" = 'true' ]; then
              gh release upload "$RELEASE_TAG" artifacts/wp-awesome-*.tgz artifacts/wp-awesome-*.zip --clobber
              gh release edit "$RELEASE_TAG" --draft=false
            else
              release_assets=$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name] | join("\n")')
              assets_complete=true
              for asset in artifacts/wp-awesome-*.tgz artifacts/wp-awesome-*.zip; do
                if ! printf '%s\n' "$release_assets" | grep -Fxq "${asset##*/}"; then
                  assets_complete=false
                fi
              done
              if [ "$assets_complete" != 'true' ]; then
                echo "The published release $RELEASE_TAG is missing assets and cannot be changed. Publish a new version to provide them." >&2
                exit 1
              fi
            fi
          else
            gh release create "$RELEASE_TAG" artifacts/wp-awesome-*.tgz artifacts/wp-awesome-*.zip --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
